# Phase 4 Confirmatory Study Preregistration Specification (v1.2.4)
# Machine-verifiable locked contract for confirmatory evaluation.

version: "1.2.4"
locked: true
locked_at: "2026-09-20T22:30:00Z"
base_commit: "fee82a2c059d486b8f0cde7b067d686cfcf39dd0"
amendment_status: "PRE-RESULT EXECUTION INTEGRATION CORRECTION (NO PHASE 4B CONFIRMATORY ENDPOINT PRODUCED)"

preregistration_doc_path: "docs/research/phase4_preregistration.md"
preregistration_doc_sha256: "a213d2544a77a4ac178ed9be0a7926c9d600656854b408bf5d0650305a6dbec5"

dataset:
  name: "fomc_scheduled_statements_2015_2019"
  events_path: "data/research/fomc/events/events.jsonl"
  anchors_path: "data/research/fomc/confirmatory_anchors/anchors.jsonl"
  source_registry_path: "data/research/fomc/source_registry.jsonl"
  policy_history_path: "data/research/fomc/policy_history.csv"
  market_dir: "data/research/market"
  num_events: 40
  num_anchors: 181
  temporal_window: "2015-01-01 to 2019-12-31"
  cutoff_timestamp: "2019-12-31T23:59:59Z"
  earliest_contamination_timestamp: "2020-01-29T19:00:00Z"
  temporal_gap_days: 48
  primary_statistical_unit: "independent_fomc_event"

contamination_dataset:
  documents_path: "data/research/fomc/phase4_contamination/documents.jsonl"
  manifest_path: "data/research/fomc/phase4_contamination/manifest.json"
  dataset_sha256: "54b3e84e8ef958e78032815a6cc76e1ca68cb0428afe71b390a583ee60e25c58"
  document_count: 50
  min_available_time: "2020-01-29T19:00:00Z"
  max_available_time: "2023-01-04T19:00:00Z"
  allowed_document_types:
    - "scheduled_statement"
    - "unscheduled_statement"
    - "policy_strategy_statement"
    - "meeting_minutes"

pre_cutoff_sham_dataset:
  documents_path: "data/research/fomc/phase4_pre_cutoff/documents.jsonl"
  manifest_path: "data/research/fomc/phase4_pre_cutoff/manifest.json"
  dataset_sha256: "5202f14b340c3212dc48c13e1ba7a8a814cb472a4c25df072bed14b7a3f19e4c"
  document_count: 63
  min_available_time: "2015-01-28T19:00:00Z"
  max_available_time: "2019-12-11T19:00:00Z"

statistical_design:
  temporal_cv_folds: 4
  cv_method: "grouped_expanding_window"
  representation_aggregation: "mean_centroid"
  permutation_unit: "event"
  oos_event_count: 32
  paired_test_permutations: 2000
  bootstrap_draws: 1000
  bootstrap_unit: "event_clustered"
  alpha: 0.05
  random_seed: 42
  simulated_power_at_d050: 0.864

representation_targets:
  primary:
    name: "next_scheduled_rate_change"
    target_type: "continuous"
    model: "ridge_regression"
    scoring:
      effect_metric: "spearman_delta"
      inferential_metric: "paired_event_absolute_error_improvement"

  coprimary_binary:
    name: "next_scheduled_change_vs_hold"
    target_type: "binary"
    model: "ridge_classifier"
    scoring:
      metric: "macro_f1"

hypotheses:
  primary:
    id: "H1_repr"
    name: "Representational Leakage"
    formula: "L_repr = ProbeScore(M_L) - ProbeScore(M_C) > 0"
    statistical_unit: "independent_fomc_event"
    test: "paired_event_sign_flip_permutation"
    target: "next_scheduled_rate_change"
    alpha: 0.05
  secondary_behavioral:
    id: "H1_behavior"
    name: "Behavioral Keyword Sensitivity Shift"
    formula: "L_behavior = MeanSensitivity(M_L) - MeanSensitivity(M_C)"
    statistical_unit: "independent_fomc_event"
    role: "descriptive_secondary"
    significance_testing: false
    multiple_testing: "not_applicable"
    fdr_correction: "none"
  secondary_economic:
    id: "H1_econ"
    name: "2Y Treasury Yield Information Coefficient Shift"
    formula: "E_L_2Y = IC(s_event_leak, delta_yield_2Y) - IC(s_event_clean, delta_yield_2Y) > 0"
    primary_endpoint: "treasury_2y_yield_change"
    exploratory_endpoint: "spy_next_close_return_from_event_close"
    test: "event_block_bootstrap_ci_95"

compute_bounds:
  doses: [0.00, 0.25, 0.50, 0.75, 1.00]
  seeds: [13, 42, 87, 123, 2024]
  token_budget: 256000
  num_blocks: 500
  block_length: 512
  base_checkpoint: "ProsusAI/finbert"
  base_revision: "4556d13015211d73dccd3fdd39d39232506f3e43"
  optimizer: "AdamW"
  mlm_lr: 5.0e-5
  weight_decay: 0.01
  mask_probability: 0.15
  max_mlm_runs: 25
  max_probe_runs: 25
  max_repetition_ratio: 0.20
  max_steps: 100
  scheduler: "none"
  warmup_ratio: 0.0

downstream_training:
  epochs: 3
  batch_size: 16
  learning_rate: 2.0e-5
  weight_decay: 0.01
  optimizer: "AdamW"
  scheduler: "linear"
  warmup_ratio: 0.1
  max_seq_length: 128
  max_steps: 500
  head_initialization: "fresh_shared_within_seed"
  sample_order: "paired_within_seed"

# Causal Twin Smoke Experiment Configuration: D0 vs D100 Activation
# All hyperparameters and isolation rules are explicitly defined.

experiment_name: encoder_twin_smoke
random_seed: 42

model:
  base_checkpoint: "ProsusAI/finbert"
  base_revision: "4556d13015211d73dccd3fdd39d39232506f3e43"
  pooling: "mean"
  task_label_schema: "fomc_stance"

mlm_treatment:
  block_length: 128
  num_blocks: 20
  batch_size: 4
  max_steps: 10
  learning_rate: 5.0e-5
  mlm_probability: 0.15
  weight_decay: 0.01

downstream:
  epochs: 1
  max_steps: 10
  batch_size: 4
  learning_rate: 2.0e-5
  weight_decay: 0.01
  max_seq_length: 128

isolation:
  mode: "treatment_a_indirect"
  sentence_level_hash: true
  document_level: "unavailable"

splits:
  training_cutoff: "2018-12-31T23:59:59Z"
  train_cutoff_year: 2018
  dev_year: 2019
  test_start_year: 2020

evaluation:
  test_sample_limit: 40
  n_bootstrap: 200
  n_permutations: 50

# CI / Smoke Test Experiment Configuration
# Designed strictly for automated test suites, CI runs, and fast regression checks.
# Reduced iteration counts for fast runtime.

experiment_name: fomc_ci_smoke_test
random_seed: 42

time:
  source_timezone: America/New_York
  internal_timezone: UTC

splits:
  train_end: "2018-12-31T23:59:59Z"
  dev_start: "2019-01-01T00:00:00Z"
  dev_end: "2019-12-31T23:59:59Z"
  test_start: "2020-01-01T00:00:00Z"

probe:
  cv: timeseries
  n_splits: 3
  n_permutations: 100
  alpha: 1.0

bootstrap:
  method: stationary
  expected_block_length: 4
  n_bootstrap: 200
  confidence_level: 0.95

economics:
  primary_metric: delta_ic
  secondary_metrics:
    - delta_sharpe
    - delta_return
  threshold: 0.20
  transaction_cost_bps: 5.0
  annualization_factor: 8.0

pit:
  require_timezone_aware: true
  reject_missing_availability: true
  allow_heuristic_fallback: true
  allowed_availability_qualities:
    - exact
    - heuristic

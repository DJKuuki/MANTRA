# Real Encoder Baseline Configuration: ProsusAI/finbert FOMC Stance Fine-Tuned Baseline (M_B)
# The raw financial sentiment head is discarded and replaced with a fresh FOMC stance head.

experiment_name: encoder_baseline_evaluation
random_seed: 42

model:
  name: finbert_baseline_mb
  base_checkpoint: "ProsusAI/finbert"
  base_revision: "4556d13015211d73dccd3fdd39d39232506f3e43"
  pooling: "mean"
  task_label_schema: "fomc_stance"
  num_labels: 3
  output_classes:
    - -1  # Dovish
    - 0   # Neutral
    - 1   # Hawkish

training:
  random_seed: 42
  learning_rate: 2.0e-5
  batch_size: 8
  max_seq_length: 128
  weight_decay: 0.01
  epochs: 2
  warmup_ratio: 0.1
  optimizer: "AdamW"
  scheduler: "linear"

splits:
  train_cutoff_year: 2018
  dev_year: 2019
  test_start_year: 2020

evaluation:
  test_sample_limit: 100
  n_bootstrap: 200
  n_permutations: 50
  metrics:
    - macro_f1
    - mcc
    - brier
    - ece
    - confusion_matrix
